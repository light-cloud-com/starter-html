<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static HTML App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>Welcome to Static HTML</h1>
        <p>Your site is ready to deploy on Light Cloud</p>
      </header>

      <main class="main">
        <div class="card">
          <button id="counter-btn">Count is <span id="count">0</span></button>
          <p>Edit <code>index.html</code> to get started</p>
        </div>
      </main>

      <footer class="footer">
        <p>Deployed with Light Cloud</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
